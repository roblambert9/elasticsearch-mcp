schema_version: "1.0"
id: "elasticsearch-mcp"
name: "Elasticsearch MCP Enterprise (Monetized)"
description: "Production Elasticsearch vector & full-text search MCP server with query-cost bounds and autonomous x402 pay-per-call rails."
author: "Rob Lambert (@roblambert9)"
repository: "https://github.com/roblambert9/elasticsearch-mcp"
pricing:
  model: "pay_per_call"
  price_usdc: 0.01
  free_tier_calls: 50
  currency: "USDC"
  settlement_network: "Solana"
registry_targets:
  - Glama
  - PulseMCP
runtime:
  command: "python"
  args: ["server.py"]